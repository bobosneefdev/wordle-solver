name: CI and release

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - uses: actions/upload-artifact@v4
        with:
          name: userscript
          path: dist/wordle-solver.user.js
          if-no-files-found: error

  release:
    needs: check
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: userscript
          path: dist
      - uses: actions/github-script@v7
        with:
          script: |
            const { readFileSync } = await import('node:fs');
            const { metadata, isNewer } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/version.mjs`);
            const { version } = metadata(readFileSync('dist/wordle-solver.user.js', 'utf8'));
            const repo = context.repo;
            let previous;
            try {
              previous = (await github.rest.repos.getLatestRelease(repo)).data.tag_name;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (previous && !isNewer(version, previous)) {
              core.info(`${version} does not exceed ${previous}; skipping release.`);
              return;
            }
            const tag = `v${version}`;
            const { data: release } = await github.rest.repos.createRelease({
              ...repo, tag_name: tag, target_commitish: context.sha,
              name: tag, draft: true, generate_release_notes: true,
            });
            await github.rest.repos.uploadReleaseAsset({
              ...repo, release_id: release.id, name: 'wordle-solver.user.js',
              data: readFileSync('dist/wordle-solver.user.js'),
              headers: { 'content-type': 'application/javascript' },
            });
            await github.rest.repos.updateRelease({
              ...repo, release_id: release.id, draft: false, make_latest: 'true',
            });
